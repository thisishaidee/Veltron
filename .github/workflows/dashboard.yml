name: Treasury dashboard checks

on:
  push:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run dashboard safety and RPC tests
        working-directory: apps/dashboard
        run: npm test
      - name: Verify dashboard runtime has no transaction or wallet signing APIs
        run: |
          ! grep -R -E "signAndSendTransaction|signMessage|DeployContract|ft_transfer|request_payment|set_paused" apps/dashboard/src apps/dashboard/index.html
