name: Dashboard checks

on:
  push:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    defaults:
      run:
        working-directory: apps/deployer
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools for Rust dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Build contract WASM files required by dashboard artifact tests
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p veltron-treasury
          cargo build --locked --release --target wasm32-unknown-unknown -p veltron-test-token
          sha256sum target/wasm32-unknown-unknown/release/veltron_treasury.wasm target/wasm32-unknown-unknown/release/veltron_test_token.wasm
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/deployer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard modules and run mobile browser tests
        run: npm run test:e2e -- --project=iphone-chromium-emulation
