name: Dashboard checks

on:
  push:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/deployer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build contract WASM files required by dashboard artifact tests
        run: cargo build --release --target wasm32-unknown-unknown -p veltron-treasury -p veltron-test-token
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/deployer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build dashboard modules and run mobile browser tests
        run: npm run test:e2e -- --project=iphone-chromium-emulation
