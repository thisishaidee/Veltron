name: Dashboard checks

on:
  push:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    defaults:
      run:
        working-directory: apps/deployer
    steps:
      - uses: actions/checkout@v4
      - name: Check out the exact source revision recorded by deployer preflight
        uses: actions/checkout@v4
        with:
          ref: c03db083db5d7628419154474b4b456a14d60cfe
          path: reference-source
      - name: Install native build tools for Rust dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Build contract WASM files required by dashboard artifact tests
        run: cargo build --locked --release --target wasm32-unknown-unknown -p veltron-treasury -p veltron-test-token
        working-directory: .
      - name: Build exact recorded reference artifacts for preflight verification
        run: |
          cargo build --locked --manifest-path reference-source/Cargo.toml --release --target wasm32-unknown-unknown -p veltron-treasury -p veltron-test-token --target-dir target-reference
          mkdir -p apps/deployer/tests/fixtures/verified-build
          cp target-reference/wasm32-unknown-unknown/release/veltron_treasury.wasm apps/deployer/tests/fixtures/verified-build/
          cp target-reference/wasm32-unknown-unknown/release/veltron_test_token.wasm apps/deployer/tests/fixtures/verified-build/
          sha256sum apps/deployer/tests/fixtures/verified-build/*.wasm
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/deployer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run commitment management safety tests
        run: npm run test:commitments
      - name: Build dashboard modules and run mobile browser tests
        run: npm run test:e2e -- --project=iphone-chromium-emulation
