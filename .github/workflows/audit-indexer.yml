name: Audit indexer checks

on:
  pull_request:
    paths:
      - "services/audit-indexer/**"
      - ".github/workflows/audit-indexer.yml"
  push:
    branches:
      - main
      - "feat/persistent-audit-indexer-api"
    paths:
      - "services/audit-indexer/**"
      - ".github/workflows/audit-indexer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run audit indexer validation tests
        run: npm test --prefix services/audit-indexer
