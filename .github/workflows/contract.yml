name: Contract checks

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "contracts/**"
      - "scripts/testnet_fee_preflight.py"
      - "scripts/testnet_treasury_fee_preflight.py"
      - "scripts/testnet_token_state_preflight.py"
      - "scripts/testnet_treasury_state_preflight.py"
      - "scripts/testnet_dual_rpc_preflight.py"
      - "scripts/testnet_treasury_initialized_preflight.py"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "contracts/**"
      - "scripts/testnet_fee_preflight.py"
      - "scripts/testnet_token_state_preflight.py"
      - "scripts/testnet_treasury_state_preflight.py"
      - "scripts/testnet_dual_rpc_preflight.py"
      - ".github/workflows/contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Build treasury WebAssembly contract
        run: cargo build --locked --release -p veltron-treasury --target wasm32-unknown-unknown
      - name: Build test-token WebAssembly contract
        run: cargo build --locked --release -p veltron-test-token --target wasm32-unknown-unknown
      - name: Calculate WebAssembly SHA-256 hashes
        run: sha256sum target/wasm32-unknown-unknown/release/veltron_treasury.wasm target/wasm32-unknown-unknown/release/veltron_test_token.wasm | tee wasm-sha256.txt
      - name: Upload release WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veltron-wasm-${{ github.sha }}
          path: |
            target/wasm32-unknown-unknown/release/veltron_treasury.wasm
            target/wasm32-unknown-unknown/release/veltron_test_token.wasm
            wasm-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Run workspace and NEAR Sandbox integration tests
        run: cargo test --locked --workspace -- --nocapture
      - name: Explicitly verify NEP-141 token initialization in NEAR Sandbox
        run: cargo test --locked -p veltron-test-token --test sandbox -- --nocapture
      - name: Read current NEAR Testnet deployment fee parameters
        run: python3 scripts/testnet_fee_preflight.py
      - name: Calculate treasury-specific Testnet deployment and storage costs (read-only)
        run: python3 scripts/testnet_treasury_fee_preflight.py
      - name: Verify deployed VTT code and initialization state (read-only)
        run: python3 scripts/testnet_token_state_preflight.py
      - name: Verify treasury deployment code against this build (read-only)
        run: python3 scripts/testnet_treasury_state_preflight.py
      - name: Cross-check finalized VTT and treasury state with two independent RPC providers (read-only)
        run: python3 scripts/testnet_dual_rpc_preflight.py
      - name: Verify initialized treasury and VTT registration state (read-only)
        run: python3 scripts/testnet_treasury_initialized_preflight.py
      - name: Set up Node.js for CLI package check
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check pinned near-cli-rs package version
        run: test "$(npm view near-cli-rs@0.31.1 version)" = "0.31.1"
      - name: Verify NEAR CLI runs without credentials
        run: npx --yes near-cli-rs@0.31.1 --version
      - name: Inspect NEAR CLI command help without credentials
        run: |
          npx --yes near-cli-rs@0.31.1 --help
          npx --yes near-cli-rs@0.31.1 account add-key --help
          npx --yes near-cli-rs@0.31.1 contract deploy --help
          npx --yes near-cli-rs@0.31.1 account list-keys --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access autogenerate-new-keypair --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access autogenerate-new-keypair save-to-keychain --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access autogenerate-new-keypair print-to-terminal --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access use-manually-provided-public-key --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-function-call-access --help
          npx --yes near-cli-rs@0.31.1 account delete-keys veltron-token.testnet --help
          npx --yes near-cli-rs@0.31.1 account delete-keys veltron-token.testnet public-keys --help
          npx --yes near-cli-rs@0.31.1 contract deploy veltron-token.testnet use-file --help
          npx --yes near-cli-rs@0.31.1 contract deploy veltron-token.testnet use-file without-init-call --help
          npx --yes near-cli-rs@0.31.1 contract deploy veltron-token.testnet use-file without-init-call network-config --help
          npx --yes near-cli-rs@0.31.1 contract deploy veltron-token.testnet use-file without-init-call network-config testnet --help
          npx --yes near-cli-rs@0.31.1 contract deploy veltron-token.testnet use-file without-init-call network-config testnet sign-with-keychain --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access autogenerate-new-keypair save-to-keychain network-config --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access autogenerate-new-keypair save-to-keychain network-config testnet --help
          npx --yes near-cli-rs@0.31.1 account add-key veltron-token.testnet grant-full-access autogenerate-new-keypair save-to-keychain network-config testnet sign-with-keychain --help
          npx --yes near-cli-rs@0.31.1 account delete-keys veltron-token.testnet public-keys network-config testnet --help
          npx --yes near-cli-rs@0.31.1 account list-keys veltron-token.testnet network-config testnet now
      - name: Read current veltron-token Testnet access keys
        run: npx --yes near-cli-rs@0.31.1 account list-keys veltron-token.testnet network-config testnet now

      - name: Read current veltron-treasury Testnet access keys
        run: npx --yes near-cli-rs@0.31.1 account list-keys veltron-treasury.testnet network-config testnet now
