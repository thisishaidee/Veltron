name: Transfer preview and execution checks

on:
  push:
    paths:
      - "apps/transfer-preview/**"
      - ".github/workflows/transfer-preview.yml"
  pull_request:
    paths:
      - "apps/transfer-preview/**"
      - ".github/workflows/transfer-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run transfer preview and execution safety tests
        run: node --test apps/transfer-preview/tests/*.test.mjs
      - name: Check execution page JavaScript syntax
        run: |
          node --input-type=module --check < <(sed -n '/<script type="module">/,/<\/script>/p' apps/transfer-preview/execution.html | sed '1d;$d')
