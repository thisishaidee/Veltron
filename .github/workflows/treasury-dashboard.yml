name: Treasury dashboard checks

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/treasury-dashboard.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/treasury-dashboard.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dashboard and audit integration tests
        run: npm test --prefix apps/dashboard
      - name: Verify dashboard has no transaction or wallet signing APIs
        run: |
          ! grep -R -E "signAndSendTransaction|signMessage|DeployContract|ft_transfer|request_payment|set_paused" apps/dashboard/src apps/dashboard/index.html
