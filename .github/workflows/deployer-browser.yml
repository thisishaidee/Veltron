name: Deployer browser checks

on:
  push:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/deployer-browser.yml"
  pull_request:
    paths:
      - "apps/deployer/**"
      - ".github/workflows/deployer-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/deployer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser checks
        run: npm run test:e2e