name: Deployer browser checks

on:
  push:
    paths:
      - "apps/deployer/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/deployer-browser.yml"
  pull_request:
    paths:
      - "apps/deployer/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/deployer-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/deployer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Build treasury contract for positive-path verification
        run: cargo build --locked --release -p veltron-treasury --target wasm32-unknown-unknown
        working-directory: .
      - name: Build test-token contract for positive-path verification
        run: cargo build --locked --release -p veltron-test-token --target wasm32-unknown-unknown
        working-directory: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate npm lockfile when missing
        id: bootstrap
        if: github.event_name == 'push'
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deployer): add reproducible npm lockfile"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push generated lockfile commit
        if: steps.bootstrap.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Install exact dependency tree
        run: npm ci
      - name: Verify pinned Meteor executor source without signing
        run: npm run test:all
      - name: Bundle the pinned wallet connector
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run mobile and desktop browser checks
        run: npm run test:e2e
