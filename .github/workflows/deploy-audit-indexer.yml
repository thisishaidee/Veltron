name: Deploy audit indexer

on:
  push:
    branches:
      - main
    paths:
      - "services/audit-indexer/**"
      - ".github/workflows/deploy-audit-indexer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run audit indexer tests
        run: npm test --prefix services/audit-indexer

      - name: Deploy existing audit Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ce0ffaff7491ff502fa23f17606a138a
          workingDirectory: services/audit-indexer
          command: deploy
